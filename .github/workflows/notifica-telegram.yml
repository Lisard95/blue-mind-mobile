# Notifica dei push su Telegram (Blue Mind). Modello unico: sta nel vault in
# Strumenti/blue-mind/notifica-telegram.yml e `notifiche.py --applica` lo copia nelle repo.
# Non modificarlo nelle repo: si sovrascrive.
name: Notifica Telegram
on: push
permissions: {}
jobs:
  notifica:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Messaggio su Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP: https://lisard95.github.io/blue-mind-mobile/
        run: |
          python3 - <<'PY'
          import html, json, os, urllib.request
          if not os.environ.get("TOKEN") or not os.environ.get("CHAT"):
              raise SystemExit("Segreti TELEGRAM_TOKEN / TELEGRAM_CHAT_ID mancanti")
          e = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          esc = lambda s: html.escape(str(s or ""), quote=False)
          repo = e["repository"]["name"]
          branch = e.get("ref", "").removeprefix("refs/heads/").removeprefix("refs/tags/")
          chi = (e.get("pusher") or {}).get("name") or os.environ.get("GITHUB_ACTOR", "?")
          commit = e.get("commits") or []
          righe = [f"⬆️ <b>{esc(repo)}</b> · {esc(branch)}", f"da {esc(chi)}" + (" · <i>force push</i>" if e.get("forced") else "")]
          if e.get("deleted"):
              righe.append("branch cancellato")
          for c in commit[:10]:
              titolo = c["message"].split("\n")[0][:120]
              autore = (c.get("author") or {}).get("name", "")
              righe.append(f"• {esc(titolo)}" + (f" <i>({esc(autore)})</i>" if autore and autore != chi else ""))
          if len(commit) > 10:
              righe.append(f"… e altri {len(commit) - 10}")
          vault = repo == "light-blue-labs"
          bottoni = [{"text": "Apri Blue Mind", "url": os.environ["APP"] + ("#/" if vault else "#/push")}]
          if e.get("compare") and not e.get("deleted"):
              bottoni.append({"text": "Differenze", "url": e["compare"]})
          dati = json.dumps({
              "chat_id": os.environ["CHAT"], "text": "\n".join(righe)[:4000], "parse_mode": "HTML",
              "disable_web_page_preview": True, "reply_markup": {"inline_keyboard": [bottoni]},
          }).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{os.environ['TOKEN']}/sendMessage",
                                       data=dati, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=20).read()
          print("Notifica inviata")
          PY
